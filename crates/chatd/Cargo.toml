[package]
name = "chatd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol.workspace = true
# Ships SQLite in the crate so Windows and Linux builds need no system libsqlite3.
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
# Both use the system TLS (Security.framework), so no second TLS stack is linked or kept in memory.
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "native-tls"] }
# Without a backend feature keyring quietly uses an in-memory mock and finds no sessions
# (`session::persistent` refuses to run on it). On Linux the Secret Service keeps sign-ins on disk;
# `linux-native` alone is the kernel keyring, emptied at every reboot. The sync flavour needs no
# async runtime; `vendored` builds libdbus so no system headers are needed.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "vendored"] }
iana-time-zone = "0.1"
# Discord adapter: `poll` on the gateway socket and a wake pipe, local time for `<t:..>`; base64 for
# the client properties header. Both are already in the tree through other dependencies.
libc = "0.2"
base64 = "0.22"
# Teams adapter: push bodies arrive gzipped. Already in the tree through other dependencies.
miniz_oxide = "0.8"
# Telegram: grammers, a pure-Rust MTProto client (the decision is at the top of
# `adapters/telegram.rs`). No default features: that leaves out its second SQLite (libsql). It is
# async, so tokio is here for one current-thread runtime that only the Telegram adapter's own
# thread owns, built when a Telegram account exists or a sign-in begins.
grammers-client = { version = "0.10", default-features = false }
grammers-session = { version = "0.10", default-features = false }
grammers-mtsender = "0.10"
grammers-tl-types = { version = "0.10", features = ["deserializable-functions"] }
grammers-crypto = "0.10"
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync", "macros"] }
# grammers-crypto 0.10.0 asks for "2.0.0-rc0" and does not build against 2.0.0 (released
# 2026-10-13, changed API). Pinned until grammers follows.
glass_pumpkin = "=2.0.0-rc0"

# Signal: presage, on libsignal-service-rs and Signal's libsignal (the decision is at the top of
# `adapters/signal.rs`). On in every build. The libraries are AGPL-3.0 git dependencies at fixed
# commits, need `protoc` on the path, and bring rustls (pinned to Signal's own CA) for Signal's
# sockets alone. `--no-default-features` leaves Signal `Unsupported`; the tests run against the
# scripted wire either way.
presage = { git = "https://github.com/whisperfish/presage", rev = "9e1f0b8d", optional = true }
# Seals each value of the Signal state file with the key the keychain holds. In presage's tree.
aes-gcm-siv = { version = "0.11", optional = true }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"], optional = true }
getrandom = "0.3"
# Android Messages (Google Messages for web): AES-256-CTR and HMAC on the phone relay, and an
# ECDSA key the phone learns from the QR code. No second TLS stack: requests go through ureq.
p256 = { version = "0.13", features = ["pkcs8"] }
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
sha2 = "0.10"
cipher = "0.4"
# Messages media is AES-256-GCM, separate from the relay's AES-CTR. chatd decrypts the bytes and
# never the picture.
aes-gcm = "0.10"
# The store traits presage asks for are async-trait's, and name chrono's times and rand's
# generator. All three are in presage's tree at these versions.
async-trait = { version = "0.1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
rand = { version = "0.9", optional = true }

[features]
default = ["signal"]
signal = ["dep:presage", "dep:aes-gcm-siv", "dep:futures", "dep:async-trait", "dep:chrono", "dep:rand", "tokio/rt"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock"] }

[target.'cfg(windows)'.dev-dependencies]
# tests/upload.rs reads a child's memory as often as every 20 ms; e2e and calls list mediads.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already used by keyring. Inspect structured timeout errors without matching messages.
dbus = { version = "0.9", features = ["vendored"] }
