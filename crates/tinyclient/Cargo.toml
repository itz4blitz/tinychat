[package]
name = "tinyclient"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol.workspace = true
sha2 = "0.10"

# GPUI is the shell. It is behind `gui` so `cargo test` and the daemons never pull the GPU stack.
#   cargo run -p tinyclient --features gui
# Pinned to a Zed commit: gpui_platform is not on crates.io. `runtime_shaders` lets it build with
# Command Line Tools only (no Xcode `metal` compiler).
gpui = { git = "https://github.com/zed-industries/zed", rev = "cb13b37a6d80d034119888b534aa0d9067fb5aee", optional = true }
unicode-segmentation = { version = "1.10", optional = true }
libc = { version = "0.2", optional = true }
# Avatars are decoded at the size they are drawn. Both are already in the tree through GPUI.
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
smallvec = { version = "1.6", optional = true }
# Reads `mediad --devices` for Settings › Audio & video. Already in the tree through protocol.
serde_json = { workspace = true, optional = true }

# Native CPU rendering of Discord Lottie stickers, pinned for reproducible builds.
tlottie = { git = "https://github.com/dkaraush/tlottie", rev = "92df98dc209bc39b1e567ec74a8c86a0af5239de", optional = true }

[dev-dependencies]
# The frame decoder's tests run without the window.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[features]
gui = ["dep:tlottie", "dep:gpui", "dep:gpui_platform", "dep:unicode-segmentation", "dep:libc", "dep:image", "dep:smallvec", "dep:serde_json", "dep:windows-sys"]
# Adds `--shot out.png`: render the window to a file and quit, for design review without
# Screen Recording permission. Pulls GPUI's test support, so it is not part of `gui`.
gui-shot = ["gui", "gpui/test-support", "gpui_platform/test-support"]

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "cb13b37a6d80d034119888b534aa0d9067fb5aee", optional = true, default-features = false, features = ["font-kit", "runtime_shaders"] }

[target.'cfg(windows)'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "cb13b37a6d80d034119888b534aa0d9067fb5aee", optional = true, default-features = false, features = ["font-kit"] }
# `--version` and `--text` print to the terminal from a windowed program. Already in the tree.
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console"] }

# The icon, in the .exe: Explorer, the taskbar and the window (GPUI loads resource 1) show it.
# Already in the tree.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# Wayland and X11 are features of their own, off without default features: without them the
# window cannot open at all ("the environment names no allowed Wayland or X11 display server").
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "cb13b37a6d80d034119888b534aa0d9067fb5aee", optional = true, default-features = false, features = ["font-kit", "wayland", "x11"] }
